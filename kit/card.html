<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Maven Pro';src:url('assets/MavenPro.ttf')}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#002B38}
/* ===== card templates (1080 x 1080) ===== */
.card{width:1080px;height:1080px;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.card *{box-sizing:border-box}
.card .H{font-family:'Maven Pro',Inter,sans-serif;font-weight:800;letter-spacing:-1px;line-height:1.05}
.card .acc{color:#F0A33A}
.card .acc2{color:#B5650B}
/* dark list */
.t-dark{background:#002B38;color:#fff}
.t-dark .logo{position:absolute;left:84px;top:78px;height:100px}
.t-dark .eb{position:absolute;left:84px;top:225px;color:#5DC4C3;font-weight:800;font-size:22px;letter-spacing:4px;text-transform:uppercase}
.t-dark .H{position:absolute;left:84px;right:150px;top:265px;font-size:68px}
.t-dark ol{position:absolute;left:84px;right:84px;top:470px;list-style:none}
.t-dark li{display:flex;gap:24px;padding:16px 0;border-bottom:2px solid rgba(255,255,255,.1);font-size:30px;font-weight:600;align-items:baseline}
.t-dark li i{font-style:normal;font-family:'Maven Pro',Inter,sans-serif;font-weight:900;color:#F0A33A;font-size:34px;width:36px;flex:none}
.t-dark li small{display:block;font-size:21px;font-weight:500;color:rgba(255,255,255,.62);margin-top:4px}
.t-dark .foot{position:absolute;left:0;right:0;bottom:0;height:130px;background:#fff;color:#002B38;border-top:8px solid #F0A33A;display:flex;align-items:center;justify-content:space-between;padding:0 84px;font-weight:800;font-size:28px}
.t-dark .foot small{display:block;font-weight:500;font-size:20px;color:#33555f}
.circ{position:absolute;right:0;top:0}
/* light email */
.t-email{background:#F4F7F8;color:#002B38}
.t-email .logo{position:absolute;left:84px;top:80px;height:78px}
.t-email .pillx{position:absolute;right:84px;top:92px;background:#002B38;color:#F0A33A;font-weight:800;font-size:20px;letter-spacing:3px;padding:12px 20px;border-radius:30px;text-transform:uppercase}
.t-email .H{position:absolute;left:84px;right:84px;top:200px;font-size:72px}
.t-email .mail{position:absolute;left:84px;right:84px;top:405px;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,43,56,.14);padding:28px 34px;font-size:26px}
.t-email .r{display:flex;gap:16px;align-items:center;padding:10px 0;border-bottom:2px solid #EEF2F3}
.t-email .r:last-child{border:0}
.t-email .k{width:110px;color:#6B8790;font-weight:600;flex:none}
.t-email .v{font-weight:600;flex:1}
.t-email .fl{background:#F0A33A;color:#002B38;font-weight:800;font-size:18px;padding:7px 12px;border-radius:8px;white-space:nowrap}
.t-email .steps{position:absolute;left:84px;right:84px;top:745px;display:flex;gap:22px}
.t-email .steps div{flex:1;background:#002B38;color:#fff;border-radius:14px;padding:20px 22px;font-size:23px;font-weight:700;line-height:1.3}
.t-email .steps b{display:block;color:#F0A33A;font-family:'Maven Pro',Inter,sans-serif;font-weight:900;font-size:32px}
.t-email .foot{position:absolute;left:84px;right:84px;bottom:52px;font-weight:800;font-size:24px}
.t-email .foot small{display:block;font-weight:500;font-size:20px;color:#5a7680}
/* big question */
.t-question{background:#fff;color:#002B38}
.t-question .bar{position:absolute;left:0;top:0;bottom:0;width:26px;background:#F0A33A}
.t-question .H{position:absolute;left:96px;right:80px;top:110px;font-size:96px;font-weight:900;letter-spacing:-3px;line-height:1.02}
.t-question .H .acc{color:#002B38;background:linear-gradient(transparent 62%,rgba(93,196,195,.55) 62%)}
.t-question .ans{position:absolute;left:96px;right:120px;top:620px;font-size:38px;font-weight:700;line-height:1.3;color:#B5650B}
.t-question .ans b{color:#002B38}
.t-question .foot{position:absolute;left:96px;right:80px;bottom:70px;display:flex;justify-content:space-between;align-items:flex-end;font-size:22px;font-weight:600;color:#5a7680;line-height:1.5}
.t-question .foot img{height:90px}
/* quote */
.t-quote{background:#5DC4C3;color:#002B38;text-align:center}
.t-quote .mark{position:absolute;left:0;right:0;top:70px;font-family:Georgia,serif;font-weight:900;font-size:400px;line-height:1;opacity:.12}
.t-quote .stars{position:absolute;left:0;right:0;top:300px;font-size:46px;letter-spacing:12px}
.t-quote .H{position:absolute;left:110px;right:110px;top:390px;font-size:60px;line-height:1.14}
.t-quote .by{position:absolute;left:0;right:0;top:690px;font-size:28px;font-weight:700}
.t-quote .by small{display:block;font-weight:500;font-size:22px;opacity:.75;margin-top:6px}
.t-quote .band{position:absolute;left:0;right:0;bottom:0;height:190px;background:#002B38;color:#fff;display:flex;align-items:center;justify-content:center;gap:40px;text-align:left}
.t-quote .band img{height:96px}
.t-quote .band div{font-size:30px;font-weight:700}
.t-quote .band small{display:block;font-size:22px;font-weight:500;opacity:.7;margin-top:6px}
/* stat */
.t-stat{background:#F0A33A;color:#002B38}
.t-stat .eb{position:absolute;left:84px;top:90px;font-weight:800;font-size:24px;letter-spacing:4px;text-transform:uppercase}
.t-stat .big{position:absolute;left:70px;top:150px;font-family:'Maven Pro',Inter,sans-serif;font-weight:900;font-size:300px;line-height:1;letter-spacing:-10px;white-space:nowrap}
.t-stat .lab{position:absolute;left:84px;right:84px;top:470px;font-size:30px;font-weight:700}
.t-stat .H{position:absolute;left:84px;right:84px;top:560px;font-size:58px}
.t-stat .src{position:absolute;left:84px;bottom:262px;font-size:18px;font-weight:600;opacity:.75}
.t-stat .panel2{position:absolute;left:0;right:0;bottom:0;height:240px;background:#002B38;color:#fff;padding:44px 84px;display:flex;justify-content:space-between;align-items:center}
.t-stat .panel2 p{font-size:30px;font-weight:600;line-height:1.35;max-width:640px}
.t-stat .panel2 small{display:block;font-size:22px;opacity:.7;margin-top:8px}
.t-stat .panel2 img{height:110px}
/* text card */
.t-text{background:#F4F7F8;color:#002B38}
.t-text .k{position:absolute;left:90px;top:96px;font-weight:800;font-size:22px;letter-spacing:4px;color:#B5650B;text-transform:uppercase}
.t-text .flow{position:absolute;left:90px;right:110px;top:160px}
.t-text .H{font-size:76px;letter-spacing:-1.5px}
.t-text .H .acc{color:#B5650B}
.t-text .rule{width:120px;height:8px;background:#B5650B;margin:50px 0 40px}
.t-text .b{font-size:34px;line-height:1.45;font-weight:500;opacity:.85;max-width:820px}
.t-text .sig{position:absolute;left:90px;bottom:84px;display:flex;align-items:center;gap:22px}
.t-text .sig img{height:84px}
.t-text .sig div{font-size:24px;font-weight:700;line-height:1.4}
.t-text .sig small{display:block;font-weight:500;font-size:20px;opacity:.7}

/* ===== animation (only when .card has class "anim") ===== */
.card.anim .a{opacity:0;animation:mbsUp .75s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
.card.anim .pop{opacity:0;transform:scale(.6);animation:mbsPop .55s cubic-bezier(.3,1.6,.5,1) var(--d,0s) forwards}
.card.anim .grow{transform:scaleY(0);transform-origin:top;animation:mbsGrowY .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
.card.anim .grow-x{transform:scaleX(0);transform-origin:left;animation:mbsGrowX .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
.card.anim .circ path{stroke-dasharray:900;stroke-dashoffset:900;animation:mbsDraw 2.4s ease-out .4s forwards}
.card.anim .circ circle{opacity:0;animation:mbsFade .4s 2.2s forwards}
.card.anim.t-question .H .acc{background-repeat:no-repeat;background-size:0% 100%;animation:mbsHl .8s ease-out 1.3s forwards}
.card.anim.t-dark .H .acc,.card.anim.t-text .H .acc{display:inline-block;animation:mbsGlow 1.2s ease-in-out 1.2s 2 alternate}
.card.anim .fl{box-shadow:0 0 0 0 rgba(240,163,58,.7)}
.card.anim.t-email .fl.pop{animation:mbsPop .55s cubic-bezier(.3,1.6,.5,1) var(--d,0s) forwards,mbsRing 1.1s ease-out calc(var(--d,0s) + .5s) 2}
@keyframes mbsUp{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes mbsPop{to{opacity:1;transform:scale(1)}}
@keyframes mbsGrowY{to{transform:scaleY(1)}}
@keyframes mbsGrowX{to{transform:scaleX(1)}}
@keyframes mbsDraw{to{stroke-dashoffset:0}}
@keyframes mbsFade{to{opacity:1}}
@keyframes mbsHl{to{background-size:100% 100%}}
@keyframes mbsGlow{from{text-shadow:0 0 0 rgba(240,163,58,0)}to{text-shadow:0 0 28px rgba(240,163,58,.55)}}
@keyframes mbsRing{from{box-shadow:0 0 0 0 rgba(240,163,58,.75)}to{box-shadow:0 0 0 22px rgba(240,163,58,0)}}
.card.anim .faint{opacity:0;animation:mbsFaint 1s ease-out var(--d,0s) forwards}
@keyframes mbsFaint{to{opacity:.12}}
</style></head><body><div id="root"></div>
<script src="cards.js"></script>
<script>window.renderCard=(p,anim)=>{const r=document.getElementById('root');r.innerHTML=cardHTML(p);if(anim)r.firstElementChild.classList.add('anim');return document.fonts.ready.then(()=>true)}</script>
</body></html>
